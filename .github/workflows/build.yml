name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Test release configuration
        run: swift test --configuration release
      - name: Check signing profile validation
        run: python3 -m unittest discover -s Tests/Packaging
      - name: Build local app bundle
        run: scripts/build-app.sh
      - name: Build native widget extension
        run: scripts/build-widget.sh build/widget-ci release
